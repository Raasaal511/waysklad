services:
  db:
    image: postgres:16-alpine
    env_file: .env
    environment:
      # ICU-локаль: без неё lower()/ILIKE не работают с кириллицей (поиск товаров)
      POSTGRES_INITDB_ARGS: "--locale-provider=icu --icu-locale=und"
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    env_file: .env
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
