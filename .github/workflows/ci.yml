name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: waysklad_test
          POSTGRES_INITDB_ARGS: "--locale-provider=icu --icu-locale=und"
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      # тестовая БД в conftest.py подключается по фиксированному URL с этими
      # же учётными данными (см. TEST_DB_URL) — держим их в согласии
      CACHE_REDIS_URL: redis://localhost:6379/15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/cache@v4
        id: pip-cache
        with:
          # кешируем весь pythonLocation, не только site-packages — иначе
          # entry point-скрипты (bin/pytest и т.п.) не попадают в кеш, и при
          # cache-hit (install пропущен) команда pytest оказывается не найдена
          path: ${{ env.pythonLocation }}
          key: pip-v2-${{ runner.os }}-${{ hashFiles('backend/requirements.txt') }}

      - name: Install dependencies
        if: steps.pip-cache.outputs.cache-hit != 'true'
        working-directory: backend
        run: pip install -r requirements.txt

      # Тестовой БД не нужна надёжность записи на диск: без fsync и ожидания
      # записи WAL при коммите прогон быстрее примерно на четверть. У service-
      # контейнера нельзя задать аргументы запуска, поэтому через ALTER SYSTEM —
      # все три параметра применяются перечиткой конфига, без рестарта
      - name: Tune PostgreSQL for tests
        run: >-
          psql postgresql://postgres:postgres@localhost:5432/postgres
          -c "ALTER SYSTEM SET fsync = off"
          -c "ALTER SYSTEM SET synchronous_commit = off"
          -c "ALTER SYSTEM SET full_page_writes = off"
          -c "SELECT pg_reload_conf()"

      - name: Run tests
        working-directory: backend
        # -n auto считает физические ядра: на раннере с 2 vCPU это одно ядро
        # и один воркер. Тесты большую часть времени ждут PostgreSQL, а не
        # процессор, поэтому воркеров держим больше, чем ядер
        run: pytest -n 4

  frontend-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Build
        working-directory: frontend
        run: npm run build

  deploy:
    needs: [backend-tests, frontend-checks]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e
            cd ${{ secrets.DEPLOY_PATH }}
            PREV=$(git rev-parse HEAD)
            echo "Deploy previous SHA (для отката): $PREV"
            git pull origin main
            docker compose -f docker-compose.prod.yml build
            docker compose -f docker-compose.prod.yml run --rm backend alembic upgrade head
            # Ждём только сервисы с настоящим healthcheck. scheduler и storefront_bot
            # собраны из образа backend: его HEALTHCHECK опрашивает :8000, который они
            # не слушают, поэтому они всегда unhealthy, и --wait по ним валил бы деплой.
            # certbot — бесконечный цикл без healthcheck.
            docker compose -f docker-compose.prod.yml up -d --wait db redis backend frontend
            docker compose -f docker-compose.prod.yml up -d scheduler storefront_bot certbot
