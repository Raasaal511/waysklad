# Connection: upgrade только для запросов, реально запрашивающих апгрейд
# (WebSocket) — обычные HTTP-запросы через тот же /api/ location не должны
# терять keep-alive из-за жёстко захардкоженного "upgrade".
map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      close;
}

# Боты соцсетей не выполняют JS SPA — отдаём им HTML с og:* через backend.
map $http_user_agent $is_link_preview_bot {
    default 0;
    ~*WhatsApp 1;
    ~*TelegramBot 1;
    ~*facebookexternalhit 1;
    ~*Facebot 1;
    ~*Twitterbot 1;
    ~*Slackbot 1;
    ~*LinkedInBot 1;
    ~*Discordbot 1;
    ~*vkShare 1;
    ~*Viber 1;
}

# default_server — молча обрывает соединение (444) на любой Host, не
# совпавший ни с одним server_name ниже (включая голый gwensoft.ru — тот же
# сервер отвечает и на него, а он зарезервирован под отдельный, не связанный
# с ВайСкладом проект). Без этого блока nginx отдал бы сюда первый попавшийся
# server{} по умолчанию.
server {
    listen 80 default_server;
    listen 443 ssl default_server;
    server_name _;
    ssl_certificate     /etc/letsencrypt/live/waysklad.gwensoft.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/waysklad.gwensoft.ru/privkey.pem;
    return 444;
}

# HTTP: только ACME challenge (для выпуска/продления сертификата) — всё
# остальное редиректим на HTTPS.
server {
    listen 80;
    server_name waysklad.gwensoft.ru;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name waysklad.gwensoft.ru;
    root /usr/share/nginx/html;
    index index.html;

    ssl_certificate     /etc/letsencrypt/live/waysklad.gwensoft.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/waysklad.gwensoft.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # резолвим backend лениво, при запросе — иначе при недоступности backend
    # на старте (перезапуск/деплой) nginx падает целиком и не отдаёт даже статику
    resolver 127.0.0.11 valid=10s;
    set $backend_upstream http://backend:8000;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # Базовые security-заголовки — приложение не встраивается в чужие фреймы,
    # не должно определяться по MIME "на глазок".
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location /api/ {
        # дефолт nginx (1MB) режет загрузку фото товара 413-й раньше, чем
        # запрос вообще доходит до backend — там своей проверки размера нет.
        client_max_body_size 10m;
        # proxy_pass с переменной не подставляет автоматически остаток URI —
        # передаём его явно через $request_uri, иначе бэкенд получает только "/api/"
        proxy_pass $backend_upstream$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # без этих трёх строк WebSocket-хендшейк (GET /api/notifications/ws)
        # не проходит через прокси — nginx держит соединение по HTTP/1.0 и
        # не форвардит заголовки Upgrade/Connection по умолчанию
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }

    location /uploads/ {
        proxy_pass $backend_upstream$request_uri;
    }

    # обработчик push внутри service worker (workbox importScripts): имя без
    # хэша, а браузер берёт импорты SW из HTTP-кэша до суток — без no-cache
    # исправление в уведомлениях доезжало бы до телефонов на день позже выката
    # (expires, а не add_header: свой add_header в location отменил бы
    # унаследованные HSTS/nosniff сервера)
    location = /push-sw.js {
        expires epoch;
        try_files $uri =404;
    }

    # файлы со хэшем в имени (Vite build) — можно кешировать надолго
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Карточка товара витрины — ботам OG HTML, людям SPA
    location ~ ^/store/([^/]+)/products/([0-9]+)/?$ {
        error_page 418 = @storefront_product_og;
        if ($is_link_preview_bot = 1) {
            return 418;
        }
        try_files /index.html =404;
    }

    # Каталог витрины — ботам OG HTML, людям SPA
    location ~ ^/store/([^/]+)/?$ {
        error_page 418 = @storefront_catalog_og;
        if ($is_link_preview_bot = 1) {
            return 418;
        }
        try_files /index.html =404;
    }

    location @storefront_product_og {
        internal;
        rewrite ^/store/([^/]+)/products/([0-9]+)/?$ /api/storefront/$1/products/$2/og break;
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location @storefront_catalog_og {
        internal;
        rewrite ^/store/([^/]+)/?$ /api/storefront/$1/og break;
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
