server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # резолвим backend лениво, при запросе — иначе при недоступности backend
    # на старте (перезапуск/деплой) nginx падает целиком и не отдаёт даже статику
    resolver 127.0.0.11 valid=10s;
    set $backend_upstream http://backend:8000;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    location /api/ {
        proxy_pass $backend_upstream/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /uploads/ {
        proxy_pass $backend_upstream/uploads/;
    }

    # файлы со хэшем в имени (Vite build) — можно кэшировать надолго
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
