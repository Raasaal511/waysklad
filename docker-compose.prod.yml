# Хостинг режет адрес, который DNS отдаёт для api.telegram.org (149.154.166.110),
# соседний адрес того же API отвечает. Без этого бот, сводки и коды молчат.
# Проверка с сервера: curl --resolve api.telegram.org:443:<ip> https://api.telegram.org/
# Перестанет отвечать — подобрать другой адрес Telegram или поднять прокси.
x-telegram-hosts: &telegram_hosts
  - "api.telegram.org:149.154.167.220"

services:
  db:
    image: postgres:16-alpine
    env_file: .env
    environment:
      # ICU-локаль: без неё lower()/ILIKE не работают с кириллицей (поиск товаров)
      POSTGRES_INITDB_ARGS: "--locale-provider=icu --icu-locale=und"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # requirepass — порт наружу не пробрасывается (только внутренняя docker-сеть),
    # но пароль даёт defense-in-depth: не выручит только если порт случайно
    # пробросят наружу или сосед по сети получит RCE в другом контейнере.
    command: redis-server --requirepass ${REDIS_PASSWORD}
    env_file: .env
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "--no-auth-warning", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    image: waysklad-backend-prod
    env_file: .env
    environment:
      # 4 воркера без общего storage для rate limit считали бы независимо
      # (реальный лимит стал бы в 4 раза мягче заявленного) — Redis даёт им
      # один общий счётчик.
      RATE_LIMIT_STORAGE_URI: redis://:${REDIS_PASSWORD}@redis:6379/0
      # тот же Redis, отдельная логическая БД (/1) — pub/sub для WebSocket-push
      # уведомлений между воркерами (открытое соединение клиента живёт только
      # в одном воркере, событие может создаться HTTP-запросом в другом).
      NOTIFICATIONS_REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/1
      # тот же Redis, отдельная логическая БД (/2) — кеш read-моделей витрины
      # и общего каталога платформы, общий между воркерами.
      CACHE_REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/2
    # --proxy-headers/--forwarded-allow-ips — доверяем X-Forwarded-For от nginx
    # (см. frontend/nginx.conf), иначе rate_limit.py видит один и тот же IP
    # (адрес nginx) для всех клиентов и лимитирует их одним общим счётчиком.
    # 2 воркера — сервер на 1 ядре (см. `nproc`), 4 давали чистый overhead
    # памяти без выгоды от параллелизма (event loop и так держит несколько
    # I/O-bound запросов в одном воркере); 2, а не 1, чтобы один долгий
    # запрос (например к БД) не блокировал вообще все остальные.
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 2 --proxy-headers --forwarded-allow-ips=*
    extra_hosts: *telegram_hosts
    volumes:
      - uploads_data:/app/uploads
      # Метаданные от внешних скриптов (deploy/backup.sh, certbot-хук) для
      # раздела «Эксплуатация» в админке. Только чтение: backend сам сюда
      # ничего не пишет и в /etc/letsencrypt не ходит.
      - ${STATUS_DIR:-/opt/waysklad/status}:/app/status:ro
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Dockerfile уже объявляет HEALTHCHECK — Docker учёл бы его и без этого
    # блока (frontend ниже уже ждёт backend: condition: service_healthy),
    # но явный блок здесь делает это видимым в самом compose-файле, тем же
    # стилем, что у db/redis выше, а не полагается на то, что кто-то откроет
    # Dockerfile, чтобы узнать, чем backend вообще проверяется. GET /api/health
    # теперь реально проверяет БД и Redis (раньше был статичный {"status":"ok"}) —
    # контейнер больше не может быть "up" и healthy, если БД/Redis отвалились.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  frontend:
    build: ./frontend
    image: waysklad-frontend-prod
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - certbot_certs:/etc/letsencrypt
      - certbot_webroot:/var/www/certbot
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy

  certbot:
    image: certbot/certbot
    env_file: .env
    volumes:
      - certbot_certs:/etc/letsencrypt
      - certbot_webroot:/var/www/certbot
    # certonly с --keep-until-expiring покрывает и первый выпуск (сертификата
    # ещё нет — frontend поднялся на временном self-signed), и последующие
    # продления (сертификат есть, но обновится только когда до истечения
    # останется < 30 дней) — единая команда без ручного шага на сервере;
    # nginx подхватывает обновлённый файл сам через периодический reload
    # в frontend/docker-entrypoint.sh
    #
    # Перед certonly чистим live/<domain>/, если она не в штатном формате
    # certbot (нет archive/<domain>/ рядом) — это self-signed-бутстрап того
    # же frontend/docker-entrypoint.sh, а не сертификат от certbot; certbot
    # откажется сохранить туда новый ("live directory exists") без этой чистки.
    #
    # --key-type rsa: дефолт certbot без явного флага — ECDSA, чья цепочка
    # цепляется к более новому корню ISRG Root X2 — не везде доверяется
    # (некоторые версии Chrome/старые ОС показывают «соединение не защищено»
    # при валидном с точки зрения openssl s_client сертификате). RSA цепляется
    # к классическому ISRG Root X1, доверенному повсеместно — не убирать флаг.
    entrypoint: >-
      sh -c "trap exit TERM;
      while :; do
        [ -d /etc/letsencrypt/live/waysklad.gwensoft.ru ] && [ ! -d /etc/letsencrypt/archive/waysklad.gwensoft.ru ] && rm -rf /etc/letsencrypt/live/waysklad.gwensoft.ru /etc/letsencrypt/renewal/waysklad.gwensoft.ru.conf;
        certbot certonly --webroot -w /var/www/certbot --non-interactive --agree-tos --keep-until-expiring --key-type rsa -d waysklad.gwensoft.ru -m $${CERTBOT_EMAIL} --quiet;
        sleep 12h &
        wait $${!};
      done"

  scheduler:
    image: waysklad-backend-prod
    env_file: .env
    environment:
      # тот же набор, что у backend (см. комментарии там) — импорт app/
      # тянет за собой deps/cache.py, который требует CACHE_REDIS_URL уже
      # на старте процесса, даже если сам scheduler кеш не использует напрямую
      RATE_LIMIT_STORAGE_URI: redis://:${REDIS_PASSWORD}@redis:6379/0
      NOTIFICATIONS_REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/1
      CACHE_REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/2
    command: python -m app.infrastructure.scheduler
    extra_hosts: *telegram_hosts
    volumes:
      - uploads_data:/app/uploads
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  storefront_bot:
    image: waysklad-backend-prod
    env_file: .env
    environment:
      RATE_LIMIT_STORAGE_URI: redis://:${REDIS_PASSWORD}@redis:6379/0
      NOTIFICATIONS_REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/1
      CACHE_REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/2
    command: python -m app.infrastructure.telegram_bot.bot
    extra_hosts: *telegram_hosts
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pgdata:
  uploads_data:
  redis_data:
  certbot_certs:
  certbot_webroot:
