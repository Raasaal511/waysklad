services:
  db:
    image: postgres:16-alpine
    env_file: .env
    environment:
      # ICU-локаль: без неё lower()/ILIKE не работают с кириллицей (поиск товаров)
      POSTGRES_INITDB_ARGS: "--locale-provider=icu --icu-locale=und"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    image: waysklad-backend-prod
    env_file: .env
    environment:
      # 4 воркера без общего storage для rate limit считали бы независимо
      # (реальный лимит стал бы в 4 раза мягче заявленного) — Redis даёт им
      # один общий счётчик.
      RATE_LIMIT_STORAGE_URI: redis://redis:6379/0
      # тот же Redis, отдельная логическая БД (/1) — pub/sub для WebSocket-push
      # уведомлений между воркерами (открытое соединение клиента живёт только
      # в одном воркере, событие может создаться HTTP-запросом в другом).
      NOTIFICATIONS_REDIS_URL: redis://redis:6379/1
    # --proxy-headers/--forwarded-allow-ips — доверяем X-Forwarded-For от nginx
    # (см. frontend/nginx.conf), иначе rate_limit.py видит один и тот же IP
    # (адрес nginx) для всех клиентов и лимитирует их одним общим счётчиком.
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 4 --proxy-headers --forwarded-allow-ips=*
    volumes:
      - uploads_data:/app/uploads
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build: ./frontend
    image: waysklad-frontend-prod
    ports:
      - "80:80"
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy

  scheduler:
    image: waysklad-backend-prod
    env_file: .env
    command: python -m app.infrastructure.scheduler
    volumes:
      - uploads_data:/app/uploads
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  uploads_data:
  redis_data:
