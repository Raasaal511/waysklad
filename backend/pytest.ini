[pytest]
asyncio_mode = auto
# -n logical: прогон в параллель по числу ядер. Тесты к этому готовы — каждый
# xdist-воркер получает свою БД (waysklad_test_gw0, ...) и свою логическую
# Redis DB, см. _worker_db_name/_worker_redis_url в conftest.py. Основное время
# прогона — не CPU, а ожидание PostgreSQL в setup (пересоздание схемы на тест),
# поэтому параллель даёт почти линейный выигрыш. Отключить на прогон: -n0.
addopts = -n logical
